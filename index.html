<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111318">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
<title>YT Queue</title>
<style>
:root{color-scheme:dark;--bg:#0c0e12;--panel:#151820;--line:#2a303d;--text:#f5f7fb;--muted:#aeb5c2;--accent:#ff4d4f;--good:#71d18d}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button,input,select{font:inherit}.shell{width:min(920px,100%);margin:auto;padding:10px 10px 40px}.row,.sectionhead,.urlhead{display:flex;align-items:center;gap:8px}.sectionhead,.urlhead{justify-content:space-between}h2{font-size:.95rem;margin:0}.brand{font-size:.86rem;font-weight:700;letter-spacing:.02em;color:#cbd1db}.muted{color:var(--muted)}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}.form{display:grid;grid-template-columns:1fr auto;gap:7px;margin-top:8px}input[type=url]{width:100%;min-width:0;background:#0e1117;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px}button,.filebtn,select{border:1px solid var(--line);background:#1d212b;color:var(--text);border-radius:8px;padding:7px 9px;cursor:pointer}.primary{background:var(--accent);border-color:transparent;font-weight:700}.ghost{background:transparent}.player{aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;margin:8px 0}#player,#player iframe{width:100%!important;height:100%!important}.controls{display:flex;justify-content:center;align-items:center;gap:4px;margin-top:2px;flex-wrap:wrap}.controls button{background:transparent;border-color:#252a34;color:#89919e;padding:7px 9px;border-radius:8px;font-size:.75rem;line-height:normal;opacity:.72}.controls button:hover{opacity:1;color:#c8ced8;border-color:#3a414f}.speed{display:flex;align-items:center;gap:4px;margin-left:4px;color:#89919e;font-size:.75rem;white-space:nowrap}.speed select{padding:7px 7px;font-size:.75rem;background:transparent;color:#aab1bd;border-color:#252a34}.meta-player{position:fixed;left:-10000px;top:-10000px;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden}.now{min-width:0}.now strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{font-variant-numeric:tabular-nums;font-size:.78rem;color:var(--muted)}.queue{list-style:none;margin:6px -12px -12px;padding:0;border-top:1px solid var(--line)}.item{display:grid;grid-template-columns:27px minmax(0,1fr) auto auto;gap:5px;align-items:center;min-height:36px;padding:3px 7px;border-bottom:1px solid var(--line)}.item:hover{background:#10131a}.item.current{background:#17131a;box-shadow:inset 3px 0 var(--accent)}.num{font-size:.68rem;color:#7f8795;text-align:right;font-variant-numeric:tabular-nums}.main{display:flex;align-items:center;min-width:0;gap:7px;cursor:pointer}.title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.84rem;font-weight:600}.meta{flex:0 0 auto;font-size:.64rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}.ord,.actions{display:flex;gap:2px}.ord button,.actions button{padding:1px 4px;min-width:25px;min-height:25px;border-radius:5px;font-size:.68rem;background:transparent}.empty{text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:9px;padding:16px;margin-top:8px}.msg{min-height:1.1em;font-size:.78rem;color:var(--muted);margin:6px 2px 0}.ok{color:var(--good)}.err{color:#ff9294}.small{font-size:.75rem}.hidden{display:none!important}.filebtn input{display:none}@media(max-width:560px){.form{grid-template-columns:1fr}.card{padding:10px}.queue{margin-left:-10px;margin-right:-10px;margin-bottom:-10px}.item{grid-template-columns:23px minmax(0,1fr) auto;min-height:34px;padding:2px 4px}.title{font-size:.79rem}.meta{font-size:.61rem}.actions{display:none}.ord button{min-width:23px;min-height:23px;padding:0 3px}.controls{gap:3px}.controls button,.speed select{font-size:.72rem;padding:6px 7px}.speed{font-size:.72rem;margin-left:2px}.brand{font-size:.82rem}}
</style>
</head>
<body>
<main class="shell">
<section class="card"><div class="urlhead"><h2>YouTube URLを追加</h2><span class="brand">YT Queue</span></div><form id="form" class="form"><input id="url" type="url" inputmode="url" placeholder="https://www.youtube.com/watch?v=..." required><button class="primary">追加</button></form><p id="msg" class="msg"></p></section>
<section class="card"><div class="sectionhead"><div class="now"><span class="small muted">再生中</span><strong id="now">まだ選択されていません</strong></div><span id="time" class="time">0:00 / 0:00</span></div><div class="player"><div id="player"></div></div><div id="meta-player" class="meta-player" aria-hidden="true"></div><div class="controls"><button id="prev">◀ 前へ</button><button id="restart">↺ 最初から</button><button id="next">次へ ▶</button><label class="speed">速度 <select id="rate"><option>.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>1.75</option><option>2</option></select></label></div></section>
<section class="card"><div class="sectionhead"><div><h2>再生リスト</h2><span id="summary" class="small muted">0本</span></div><div class="row"><button id="backup" class="ghost small">バックアップ</button><label class="filebtn ghost small">復元<input id="restore" type="file" accept="application/json,.json"></label></div></div><ol id="queue" class="queue"></ol><div id="empty" class="empty">上の欄にYouTube URLを貼り付けてください。</div></section>
</main>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
(()=>{'use strict';
const K='ytq_state_v3',SK='ytq_settings_v3',SAVE=2500,$=id=>document.getElementById(id);const E={form:$('form'),url:$('url'),msg:$('msg'),now:$('now'),time:$('time'),queue:$('queue'),empty:$('empty'),summary:$('summary'),prev:$('prev'),next:$('next'),restart:$('restart'),rate:$('rate'),backup:$('backup'),restore:$('restore')};let S=read(K,{items:[],i:-1}),Q=read(SK,{rate:1}),P=null,M=null,ready=false,timer=null,ending=false,metaReady=false,metaBusy=false,metaCurrent='',metaQueue=[];S.items=(Array.isArray(S.items)?S.items:[]).map(clean).filter(Boolean);S.i=S.items.length?Math.min(Math.max(Number.isInteger(S.i)?S.i:0,0),S.items.length-1):-1;Q.rate=Number(Q.rate)||1;E.rate.value=String(Q.rate);write();render();mediaHandlers();
function read(k,d){try{return{...d,...JSON.parse(localStorage.getItem(k)||'{}')}}catch{return d}}function write(){localStorage.setItem(K,JSON.stringify(S));localStorage.setItem(SK,JSON.stringify({rate:Q.rate,auto:true}))}
function clean(x){const id=vid(x?.id||x?.url);if(!id)return null;return{id,url:'https://www.youtube.com/watch?v='+id,title:String(x.title||id).slice(0,300),pos:Math.max(0,+x.pos||+x.position||0),dur:Math.max(0,+x.dur||+x.duration||0),done:!!(x.done||x.completed)}}
function vid(v){v=String(v||'').trim();if(/^[\w-]{11}$/.test(v))return v;try{const u=new URL(v.startsWith('http')?v:'https://'+v),h=u.hostname.replace(/^www\.|^m\./,'');if(h==='youtu.be')return chk(u.pathname.split('/').filter(Boolean)[0]);if(h==='youtube.com'||h.endsWith('.youtube.com')){const q=u.searchParams.get('v');if(q)return chk(q);const p=u.pathname.split('/').filter(Boolean);if(['shorts','embed','live'].includes(p[0]))return chk(p[1])}}catch{}return null}function chk(v){v=String(v||'').split(/[?&#]/)[0];return /^[\w-]{11}$/.test(v)?v:null}
window.onYouTubeIframeAPIReady=()=>{P=new YT.Player('player',{width:'100%',height:'100%',playerVars:{autoplay:0,controls:1,playsinline:1,rel:0,enablejsapi:1,origin:location.origin},events:{onReady(){ready=true;if(S.i>=0)load(S.i,false,false);timer=setInterval(tick,SAVE);updateMedia()},onStateChange:onState,onError:e=>msg(({2:'URLまたは動画IDが正しくありません。',5:'この動画は再生できません。',100:'動画が削除または非公開です。',101:'外部サイトでの埋め込みが許可されていません。',150:'外部サイトでの埋め込みが許可されていません。',153:'YouTube側が埋め込み元を確認できません。'}[e.data]||'YouTube再生エラー '+e.data),'err')}});M=new YT.Player('meta-player',{width:'1',height:'1',playerVars:{autoplay:0,controls:0,playsinline:1,rel:0,enablejsapi:1,origin:location.origin},events:{onReady(){metaReady=true;hydrateTitles()},onStateChange:metaState,onError:()=>setTimeout(metaNext,40)}});};
function needsTitle(x){return !x?.title||x.title===x.id||/^動画\s*\d+$/.test(x.title)}
function hydrateTitles(){S.items.filter(needsTitle).forEach(x=>queueMeta(x.id))}
function queueMeta(id){if(!metaReady||!id)return;if(id===metaCurrent||metaQueue.includes(id))return;metaQueue.push(id);if(!metaBusy)metaNext()}
function metaNext(){if(!metaReady)return;const id=metaQueue.shift();if(!id){metaBusy=false;metaCurrent='';return}metaBusy=true;metaCurrent=id;try{M.cueVideoById(id)}catch{setTimeout(metaNext,40)}}
function metaState(e){if(e.data!==YT.PlayerState.CUED)return;try{const d=M.getVideoData();if(d?.video_id===metaCurrent&&d.title){const x=S.items.find(v=>v.id===metaCurrent);if(x&&needsTitle(x)){x.title=d.title;write();render()}}}catch{}setTimeout(metaNext,40)}
function onState(e){if(!cur())return;if(e.data===YT.PlayerState.PLAYING||e.data===YT.PlayerState.PAUSED||e.data===YT.PlayerState.CUED){const d=data();if(d?.video_id===cur().id&&d.title)cur().title=d.title;save();applyRate();render();updateMedia()}if(e.data===YT.PlayerState.ENDED)ended()}
function data(){try{return P.getVideoData()}catch{return null}}function cur(){return S.items[S.i]||null}
function load(i,play=true,saveOld=true){if(!ready||!S.items[i])return;if(saveOld)save();S.i=i;const x=cur();if(x.done)x.pos=0;x.done=false;ending=false;write();render();updateMedia();try{const o={videoId:x.id,startSeconds:Math.max(0,+x.pos||0)};play?P.loadVideoById(o):P.cueVideoById(o);applyRate()}catch{}}
function save(){if(!ready||!cur()||ending)return;try{const d=data();if(d?.video_id&&d.video_id!==cur().id)return;const p=+P.getCurrentTime()||0,dur=+P.getDuration()||0;if(p>=0)cur().pos=p;if(dur>0)cur().dur=dur;write()}catch{}}
function tick(){if(!ready)return;save();renderProgress();try{const d=+P.getDuration()||0,p=+P.getCurrentTime()||0;if(d>0&&d-p<.35&&P.getPlayerState()!==YT.PlayerState.PLAYING&&cur()&&!cur().done)ended()}catch{}}
function ended(){if(ending||!cur())return;ending=true;cur().pos=0;cur().done=true;write();render();updateMedia();if(S.i<S.items.length-1)setTimeout(()=>load(S.i+1,true,false),150);else ending=false}
function applyRate(){try{P.setPlaybackRate(Q.rate)}catch{}}
function renderProgress(){const x=cur();if(!x)return E.time.textContent='0:00 / 0:00';try{x.pos=+P.getCurrentTime()||x.pos;x.dur=+P.getDuration()||x.dur}catch{}E.time.textContent=fmt(x.pos)+' / '+fmt(x.dur);updatePosition()}
function render(){E.summary.textContent=S.items.length+'本';E.empty.classList.toggle('hidden',S.items.length>0);const x=cur();E.now.textContent=x?x.title:'まだ選択されていません';E.queue.innerHTML='';S.items.forEach((x,i)=>{const li=document.createElement('li');li.className='item'+(i===S.i?' current':'');li.innerHTML='<span class="num"></span><div class="main"><span class="title"></span><span class="meta"></span></div><div class="ord"><button data-a="up" title="上へ">↑</button><button data-a="down" title="下へ">↓</button></div><div class="actions"><button data-a="del" title="削除">×</button></div>';li.querySelector('.num').textContent=String(i+1).padStart(2,'0');li.querySelector('.title').textContent=x.title;li.querySelector('.meta').textContent=x.done?'済':x.dur?fmt(x.pos)+'/'+fmt(x.dur):x.pos?fmt(x.pos):'未';li.querySelector('.main').onclick=()=>load(i,true);li.querySelectorAll('button').forEach(b=>b.onclick=()=>act(b.dataset.a,i));E.queue.appendChild(li)});renderProgress()}
function act(a,i){if(a==='play')return load(i,true);if(a==='del'){save();S.items.splice(i,1);if(!S.items.length)S.i=-1;else if(i<S.i)S.i--;else if(i===S.i)S.i=Math.min(S.i,S.items.length-1);write();render();if(S.i>=0)load(S.i,false,false);return}if(a==='up'&&i>0)move(i,i-1);if(a==='down'&&i<S.items.length-1)move(i,i+1)}
function move(a,b){save();[S.items[a],S.items[b]]=[S.items[b],S.items[a]];if(S.i===a)S.i=b;else if(S.i===b)S.i=a;write();render()}
function add(raw){const id=vid(raw);if(!id)return msg('YouTubeのURLとして認識できませんでした。','err');const n=S.items.findIndex(x=>x.id===id);if(n>=0){load(n,true);return msg('すでにある動画へ移動しました。','ok')}const x=clean({id,title:'動画 '+(S.items.length+1)});S.items.push(x);if(S.i<0)S.i=0;write();render();queueMeta(id);if(ready&&S.items.length===1)load(0,false,false);msg('追加しました。','ok')}
function fmt(n){n=Math.max(0,Math.floor(+n||0));const h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=n%60;return h?h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'):m+':'+String(s).padStart(2,'0')}
function msg(t,c=''){E.msg.textContent=t;E.msg.className='msg '+c}
function backup(){save();const b=new Blob([JSON.stringify({app:'YT Queue',version:3,state:S,settings:{rate:Q.rate,auto:true}},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='yt-queue-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function restore(f){try{const j=JSON.parse(await f.text()),s=j.state||j;S={items:(s.items||[]).map(clean).filter(Boolean),i:Number.isInteger(s.i)?s.i:Number.isInteger(s.currentIndex)?s.currentIndex:0};if(!S.items.length)S.i=-1;else S.i=Math.min(Math.max(S.i,0),S.items.length-1);if(j.settings)Q.rate=+j.settings.rate||1;E.rate.value=String(Q.rate);write();render();hydrateTitles();if(ready&&S.i>=0)load(S.i,false,false);msg('バックアップを復元しました。','ok')}catch{msg('バックアップを読み込めませんでした。','err')}E.restore.value=''}
function mediaHandlers(){if(!('mediaSession'in navigator))return;const set=(a,f)=>{try{navigator.mediaSession.setActionHandler(a,f)}catch{}};set('play',()=>P?.playVideo());set('pause',()=>P?.pauseVideo());set('nexttrack',()=>S.i<S.items.length-1&&load(S.i+1,true));set('previoustrack',()=>S.i>0&&load(S.i-1,true));set('seekbackward',d=>seek(-(d.seekOffset||10)));set('seekforward',d=>seek(d.seekOffset||10));set('seekto',d=>Number.isFinite(d.seekTime)&&seekTo(d.seekTime))}
function seek(d){try{seekTo((+P.getCurrentTime()||0)+d)}catch{}}function seekTo(t){try{const d=+P.getDuration()||0;P.seekTo(Math.max(0,d?Math.min(t,d):t),true);save()}catch{}}
function updateMedia(){if(!('mediaSession'in navigator)||!cur())return;try{navigator.mediaSession.metadata=new MediaMetadata({title:cur().title,artist:'YT Queue',album:(S.i+1)+' / '+S.items.length})}catch{}updatePosition()}
function updatePosition(){if(!('mediaSession'in navigator)||!navigator.mediaSession.setPositionState||!cur()||!cur().dur)return;try{navigator.mediaSession.setPositionState({duration:cur().dur,playbackRate:Q.rate,position:Math.min(Math.max(cur().pos||0,0),Math.max(cur().dur-.001,0))})}catch{}}
E.form.onsubmit=e=>{e.preventDefault();add(E.url.value);E.url.value=''};E.prev.onclick=()=>S.i>0&&load(S.i-1,true);E.next.onclick=()=>S.i<S.items.length-1&&load(S.i+1,true);E.restart.onclick=()=>{if(!cur())return;cur().pos=0;cur().done=false;write();try{P.seekTo(0,true);P.playVideo()}catch{}};E.rate.onchange=()=>{Q.rate=+E.rate.value||1;write();applyRate()};E.backup.onclick=backup;E.restore.onchange=()=>E.restore.files?.[0]&&restore(E.restore.files[0]);
['pagehide','beforeunload'].forEach(n=>addEventListener(n,save));document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>
</body></html>
