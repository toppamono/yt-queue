<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111318">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
<title>YT Queue</title>
<style>
:root{color-scheme:dark;--bg:#0c0e12;--panel:#151820;--line:#2a303d;--text:#f5f7fb;--muted:#aeb5c2;--accent:#ff4d4f;--good:#71d18d}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button,input,select{font:inherit}.shell{width:min(920px,100%);margin:auto;padding:18px 12px 48px}.head,.row,.sectionhead{display:flex;align-items:center;gap:10px}.head,.sectionhead{justify-content:space-between}.head{padding:8px 2px 16px}h1{margin:0;font-size:2rem}h2{font-size:1rem;margin:0}.sub,.muted,.status{color:var(--muted)}.sub{font-size:.78rem;margin:0 0 3px}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:14px;margin-bottom:14px}.form{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}input[type=url]{width:100%;min-width:0;background:#0e1117;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:12px}button,.filebtn,select{border:1px solid var(--line);background:#1d212b;color:var(--text);border-radius:10px;padding:9px 11px;cursor:pointer}.primary{background:var(--accent);border-color:transparent;font-weight:700}.ghost{background:transparent}.player{aspect-ratio:16/9;background:#000;border-radius:13px;overflow:hidden;margin:10px 0}#player,#player iframe{width:100%!important;height:100%!important}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.settings{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;font-size:.88rem}.settings .auto{margin-left:auto}.status{width:100%;font-size:.8rem;color:var(--good)}.now{min-width:0}.now strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{font-variant-numeric:tabular-nums;font-size:.82rem;color:var(--muted)}.queue{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}.item{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:8px;align-items:center;background:#10131a;border:1px solid var(--line);border-radius:12px;padding:8px}.item.current{border-color:var(--accent);box-shadow:inset 3px 0 var(--accent)}.ord{display:grid;gap:3px}.ord button{padding:2px;min-height:25px}.main{min-width:0;cursor:pointer}.title{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:650}.meta{font-size:.75rem;color:var(--muted);margin-top:3px}.actions{display:flex;gap:4px}.actions button{padding:6px 8px}.empty{text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:11px;padding:20px;margin-top:10px}.msg{min-height:1.2em;font-size:.84rem;color:var(--muted);margin:7px 2px 0}.ok{color:var(--good)}.err{color:#ff9294}.small{font-size:.8rem}.hidden{display:none!important}.filebtn input{display:none}@media(max-width:560px){.form{grid-template-columns:1fr}.card{padding:11px}.settings .auto{margin-left:0;width:100%}.item{grid-template-columns:28px minmax(0,1fr) auto}.actions{flex-direction:column}}
</style>
</head>
<body>
<main class="shell">
<header class="head"><div><p class="sub">Brave用・個人視聴キュー</p><h1>YT Queue</h1></div><button id="install" class="ghost hidden">ホーム画面へ</button></header>
<section class="card"><h2>YouTube URLを追加</h2><form id="form" class="form"><input id="url" type="url" inputmode="url" placeholder="https://www.youtube.com/watch?v=..." required><button class="primary">追加</button></form><p id="msg" class="msg"></p></section>
<section class="card"><div class="sectionhead"><div class="now"><span class="small muted">再生中</span><strong id="now">まだ選択されていません</strong></div><span id="time" class="time">0:00 / 0:00</span></div><div class="player"><div id="player"></div></div><div class="controls"><button id="prev">◀ 前へ</button><button id="restart">↺ 最初から</button><button id="next">次へ ▶</button></div><div class="settings"><label>速度 <select id="rate"><option>.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>1.75</option><option>2</option></select></label><label class="auto"><input id="auto" type="checkbox" checked> 終了後に次へ</label><span id="status" class="status">連続再生：準備中</span></div></section>
<section class="card"><div class="sectionhead"><div><h2>再生リスト</h2><span id="summary" class="small muted">0本</span></div><div class="row"><button id="backup" class="ghost small">バックアップ</button><label class="filebtn ghost small">復元<input id="restore" type="file" accept="application/json,.json"></label></div></div><ol id="queue" class="queue"></ol><div id="empty" class="empty">上の欄にYouTube URLを貼り付けてください。</div></section>
<section class="card"><h2>Braveで使うとき</h2><p class="muted small">動画はYouTube公式の埋め込みプレイヤーで再生します。リストと再生位置はこの端末のBrave内だけに保存します。AndroidではBraveの「バックグラウンド再生」を有効にしてください。</p></section>
</main>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
(()=>{'use strict';
const K='ytq_state_v3',SK='ytq_settings_v3',SAVE=2500;
const $=id=>document.getElementById(id),E={form:$('form'),url:$('url'),msg:$('msg'),now:$('now'),time:$('time'),status:$('status'),queue:$('queue'),empty:$('empty'),summary:$('summary'),prev:$('prev'),next:$('next'),restart:$('restart'),rate:$('rate'),auto:$('auto'),backup:$('backup'),restore:$('restore'),install:$('install')};
let S=read(K,{items:[],i:-1}),Q=read(SK,{rate:1,auto:true}),P=null,ready=false,timer=null,loaded='',ending=false,prompt=null;
S.items=(Array.isArray(S.items)?S.items:[]).map(clean).filter(Boolean);if(!S.items.length)S.i=-1;else S.i=Math.min(Math.max(Number.isInteger(S.i)?S.i:0,0),S.items.length-1);Q.rate=Number(Q.rate)||1;Q.auto=Q.auto!==false;E.rate.value=String(Q.rate);E.auto.checked=Q.auto;render();mediaHandlers();
function read(k,d){try{return {...d,...JSON.parse(localStorage.getItem(k)||'{}')}}catch{return d}}function write(){localStorage.setItem(K,JSON.stringify(S));localStorage.setItem(SK,JSON.stringify(Q))}
function clean(x){const id=vid(x?.id||x?.url);if(!id)return null;return{id,url:'https://www.youtube.com/watch?v='+id,title:String(x.title||id).slice(0,300),pos:Math.max(0,+x.pos||+x.position||0),dur:Math.max(0,+x.dur||+x.duration||0),done:!!(x.done||x.completed)}}
function vid(v){v=String(v||'').trim();if(/^[\w-]{11}$/.test(v))return v;try{const u=new URL(v.startsWith('http')?v:'https://'+v),h=u.hostname.replace(/^www\.|^m\./,'');if(h==='youtu.be')return chk(u.pathname.split('/').filter(Boolean)[0]);if(h==='youtube.com'||h.endsWith('.youtube.com')){const q=u.searchParams.get('v');if(q)return chk(q);const p=u.pathname.split('/').filter(Boolean);if(['shorts','embed','live'].includes(p[0]))return chk(p[1])}}catch{}return null}function chk(v){v=String(v||'').split(/[?&#]/)[0];return /^[\w-]{11}$/.test(v)?v:null}
window.onYouTubeIframeAPIReady=()=>{P=new YT.Player('player',{width:'100%',height:'100%',playerVars:{autoplay:0,controls:1,playsinline:1,rel:0,enablejsapi:1,origin:location.origin},events:{onReady(){ready=true;if(S.i>=0)load(S.i,false,false);timer=setInterval(tick,SAVE);stat('連続再生：待機中');updateMedia()},onStateChange:onState,onError:e=>msg(({2:'URLまたは動画IDが正しくありません。',5:'この動画は再生できません。',100:'動画が削除または非公開です。',101:'外部サイトでの埋め込みが許可されていません。',150:'外部サイトでの埋め込みが許可されていません。',153:'YouTube側が埋め込み元を確認できません。'}[e.data]||'YouTube再生エラー '+e.data),'err')}})};
function onState(e){if(!cur())return;if(e.data===YT.PlayerState.PLAYING||e.data===YT.PlayerState.PAUSED||e.data===YT.PlayerState.CUED){const d=data();if(d?.video_id===cur().id&&d.title)cur().title=d.title;save();applyRate();render();updateMedia();stat(e.data===YT.PlayerState.PLAYING?'再生中：位置を自動保存':e.data===YT.PlayerState.PAUSED?'一時停止：位置を保存済み':'連続再生：再生待ち')}if(e.data===YT.PlayerState.BUFFERING)stat('読み込み中…');if(e.data===YT.PlayerState.ENDED)ended()}
function data(){try{return P.getVideoData()}catch{return null}}function cur(){return S.items[S.i]||null}
function load(i,play=true,saveOld=true){if(!ready||!S.items[i])return;if(saveOld)save();S.i=i;const x=cur();if(x.done)x.pos=0;x.done=false;loaded=x.id;ending=false;write();render();updateMedia();try{const o={videoId:x.id,startSeconds:Math.max(0,+x.pos||0)};play?P.loadVideoById(o):P.cueVideoById(o);applyRate()}catch{}}
function save(){if(!ready||!cur()||ending)return;try{const d=data();if(d?.video_id&&d.video_id!==cur().id)return;const p=+P.getCurrentTime()||0,dur=+P.getDuration()||0;if(p>=0)cur().pos=p;if(dur>0)cur().dur=dur;write()}catch{}}
function tick(){if(!ready)return;save();renderProgress();try{const d=+P.getDuration()||0,p=+P.getCurrentTime()||0;if(d>0&&d-p<.35&&P.getPlayerState()!==YT.PlayerState.PLAYING&&cur()&&!cur().done)ended()}catch{}}
function ended(){if(ending||!cur())return;ending=true;cur().pos=0;cur().done=true;write();render();updateMedia();if(Q.auto&&S.i<S.items.length-1){stat('次の動画へ移動中…');setTimeout(()=>load(S.i+1,true,false),150)}else{stat(S.i===S.items.length-1?'再生リストの最後です':'連続再生：停止');ending=false}}
function applyRate(){try{P.setPlaybackRate(Q.rate)}catch{}}
function renderProgress(){const x=cur();if(!x)return E.time.textContent='0:00 / 0:00';try{x.pos=+P.getCurrentTime()||x.pos;x.dur=+P.getDuration()||x.dur}catch{}E.time.textContent=fmt(x.pos)+' / '+fmt(x.dur);updatePosition()}
function render(){E.summary.textContent=S.items.length+'本';E.empty.classList.toggle('hidden',S.items.length>0);const x=cur();E.now.textContent=x?x.title:'まだ選択されていません';E.queue.innerHTML='';S.items.forEach((x,i)=>{const li=document.createElement('li');li.className='item'+(i===S.i?' current':'');li.innerHTML='<div class="ord"><button data-a="up">▲</button><button data-a="down">▼</button></div><div class="main"><span class="title"></span><div class="meta"></div></div><div class="actions"><button data-a="play">▶</button><button data-a="del">×</button></div>';li.querySelector('.title').textContent=x.title;li.querySelector('.meta').textContent=(x.done?'視聴済み · ':'')+(x.dur?fmt(x.pos)+' / '+fmt(x.dur):x.pos?fmt(x.pos)+'から再開':'未再生');li.querySelector('.main').onclick=()=>load(i,true);li.querySelectorAll('button').forEach(b=>b.onclick=()=>act(b.dataset.a,i));E.queue.appendChild(li)});renderProgress()}
function act(a,i){if(a==='play')return load(i,true);if(a==='del'){save();S.items.splice(i,1);if(!S.items.length)S.i=-1;else if(i<S.i)S.i--;else if(i===S.i)S.i=Math.min(S.i,S.items.length-1);write();render();if(S.i>=0)load(S.i,false,false);return}if(a==='up'&&i>0)move(i,i-1);if(a==='down'&&i<S.items.length-1)move(i,i+1)}
function move(a,b){save();[S.items[a],S.items[b]]=[S.items[b],S.items[a]];if(S.i===a)S.i=b;else if(S.i===b)S.i=a;write();render()}
function add(raw){const id=vid(raw);if(!id)return msg('YouTubeのURLとして認識できませんでした。','err');const n=S.items.findIndex(x=>x.id===id);if(n>=0){load(n,true);return msg('すでにある動画へ移動しました。','ok')}S.items.push(clean({id,title:'動画 '+(S.items.length+1)}));if(S.i<0)S.i=0;write();render();if(ready&&S.items.length===1)load(0,false,false);msg('追加しました。','ok')}
function fmt(n){n=Math.max(0,Math.floor(+n||0));const h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=n%60;return h?h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'):m+':'+String(s).padStart(2,'0')}
function msg(t,c=''){E.msg.textContent=t;E.msg.className='msg '+c}function stat(t){E.status.textContent=t}
function backup(){save();const b=new Blob([JSON.stringify({app:'YT Queue',version:3,state:S,settings:Q},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='yt-queue-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function restore(f){try{const j=JSON.parse(await f.text()),s=j.state||j;S={items:(s.items||[]).map(clean).filter(Boolean),i:Number.isInteger(s.i)?s.i:Number.isInteger(s.currentIndex)?s.currentIndex:0};if(!S.items.length)S.i=-1;else S.i=Math.min(Math.max(S.i,0),S.items.length-1);if(j.settings)Q={rate:+j.settings.rate||1,auto:j.settings.auto!==false&&j.settings.autoNext!==false};E.rate.value=String(Q.rate);E.auto.checked=Q.auto;write();render();if(ready&&S.i>=0)load(S.i,false,false);msg('バックアップを復元しました。','ok')}catch{msg('バックアップを読み込めませんでした。','err')}E.restore.value=''}
function mediaHandlers(){if(!('mediaSession'in navigator))return;const set=(a,f)=>{try{navigator.mediaSession.setActionHandler(a,f)}catch{}};set('play',()=>P?.playVideo());set('pause',()=>P?.pauseVideo());set('nexttrack',()=>S.i<S.items.length-1&&load(S.i+1,true));set('previoustrack',()=>S.i>0&&load(S.i-1,true));set('seekbackward',d=>seek(-(d.seekOffset||10)));set('seekforward',d=>seek(d.seekOffset||10));set('seekto',d=>Number.isFinite(d.seekTime)&&seekTo(d.seekTime))}
function seek(d){try{seekTo((+P.getCurrentTime()||0)+d)}catch{}}function seekTo(t){try{const d=+P.getDuration()||0;P.seekTo(Math.max(0,d?Math.min(t,d):t),true);save()}catch{}}
function updateMedia(){if(!('mediaSession'in navigator)||!cur())return;try{navigator.mediaSession.metadata=new MediaMetadata({title:cur().title,artist:'YT Queue',album:(S.i+1)+' / '+S.items.length})}catch{}updatePosition()}
function updatePosition(){if(!('mediaSession'in navigator)||!navigator.mediaSession.setPositionState||!cur()||!cur().dur)return;try{navigator.mediaSession.setPositionState({duration:cur().dur,playbackRate:Q.rate,position:Math.min(Math.max(cur().pos||0,0),Math.max(cur().dur-.001,0))})}catch{}}
E.form.onsubmit=e=>{e.preventDefault();add(E.url.value);E.url.value=''};E.prev.onclick=()=>S.i>0&&load(S.i-1,true);E.next.onclick=()=>S.i<S.items.length-1&&load(S.i+1,true);E.restart.onclick=()=>{if(!cur())return;cur().pos=0;cur().done=false;write();try{P.seekTo(0,true);P.playVideo()}catch{}};E.rate.onchange=()=>{Q.rate=+E.rate.value||1;write();applyRate()};E.auto.onchange=()=>{Q.auto=E.auto.checked;write()};E.backup.onclick=backup;E.restore.onchange=()=>E.restore.files?.[0]&&restore(E.restore.files[0]);
['pagehide','beforeunload'].forEach(n=>addEventListener(n,save));document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});addEventListener('beforeinstallprompt',e=>{e.preventDefault();prompt=e;E.install.classList.remove('hidden')});E.install.onclick=async()=>{if(!prompt)return;prompt.prompt();await prompt.userChoice;prompt=null;E.install.classList.add('hidden')};if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>
</body></html>
