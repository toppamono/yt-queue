<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111318">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
<title>YT Queue</title>
<style>
:root{color-scheme:dark;--bg:#0c0e12;--panel:#151820;--line:#2a303d;--text:#f5f7fb;--muted:#aeb5c2;--accent:#ff4d4f;--good:#71d18d}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button,input,select{font:inherit}.shell{width:min(920px,100%);margin:auto;padding:14px 10px 40px}.head,.row,.sectionhead{display:flex;align-items:center;gap:8px}.head,.sectionhead{justify-content:space-between}.head{padding:6px 2px 12px}h1{margin:0;font-size:1.75rem}h2{font-size:.95rem;margin:0}.sub,.muted,.status{color:var(--muted)}.sub{font-size:.74rem;margin:0 0 2px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}.form{display:grid;grid-template-columns:1fr auto;gap:7px;margin-top:8px}input[type=url]{width:100%;min-width:0;background:#0e1117;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px}button,.filebtn,select{border:1px solid var(--line);background:#1d212b;color:var(--text);border-radius:8px;padding:7px 9px;cursor:pointer}.primary{background:var(--accent);border-color:transparent;font-weight:700}.ghost{background:transparent}.player{aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;margin:8px 0}#player,#player iframe{width:100%!important;height:100%!important}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.settings{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:8px;font-size:.82rem}.settings .auto{margin-left:auto}.status{width:100%;font-size:.75rem;color:var(--good)}.now{min-width:0}.now strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{font-variant-numeric:tabular-nums;font-size:.78rem;color:var(--muted)}.queue{list-style:none;margin:6px -12px -12px;padding:0;border-top:1px solid var(--line)}.item{display:grid;grid-template-columns:27px minmax(0,1fr) auto auto;gap:5px;align-items:center;min-height:36px;padding:3px 7px;border-bottom:1px solid var(--line)}.item:hover{background:#10131a}.item.current{background:#17131a;box-shadow:inset 3px 0 var(--accent)}.num{font-size:.68rem;color:#7f8795;text-align:right;font-variant-numeric:tabular-nums}.main{display:flex;align-items:center;min-width:0;gap:7px;cursor:pointer}.title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.84rem;font-weight:600}.meta{flex:0 0 auto;font-size:.64rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}.ord,.actions{display:flex;gap:2px}.ord button,.actions button{padding:1px 4px;min-width:25px;min-height:25px;border-radius:5px;font-size:.68rem;background:transparent}.empty{text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:9px;padding:16px;margin-top:8px}.msg{min-height:1.1em;font-size:.78rem;color:var(--muted);margin:6px 2px 0}.ok{color:var(--good)}.err{color:#ff9294}.small{font-size:.75rem}.hidden{display:none!important}.filebtn input{display:none}@media(max-width:560px){.form{grid-template-columns:1fr}.card{padding:10px}.settings .auto{margin-left:0;width:100%}.queue{margin-left:-10px;margin-right:-10px;margin-bottom:-10px}.item{grid-template-columns:23px minmax(0,1fr) auto;min-height:34px;padding:2px 4px}.title{font-size:.79rem}.meta{font-size:.61rem}.actions{display:none}.ord button{min-width:23px;min-height:23px;padding:0 3px}}
</style>
</head>
<body>
<main class="shell">
<header class="head"><div><p class="sub">Brave用・個人視聴キュー</p><h1>YT Queue</h1></div><button id="install" class="ghost hidden">ホーム画面へ</button></header>
<section class="card"><h2>YouTube URLを追加</h2><form id="form" class="form"><input id="url" type="url" inputmode="url" placeholder="https://www.youtube.com/watch?v=..." required><button class="primary">追加</button></form><p id="msg" class="msg"></p></section>
<section class="card"><div class="sectionhead"><div class="now"><span class="small muted">再生中</span><strong id="now">まだ選択されていません</strong></div><span id="time" class="time">0:00 / 0:00</span></div><div class="player"><div id="player"></div></div><div class="controls"><button id="prev">◀ 前へ</button><button id="restart">↺ 最初から</button><button id="next">次へ ▶</button></div><div class="settings"><label>速度 <select id="rate"><option>.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>1.75</option><option>2</option></select></label><label class="auto"><input id="auto" type="checkbox" checked> 終了後に次へ</label><span id="status" class="status">連続再生：準備中</span></div></section>
<section class="card"><div class="sectionhead"><div><h2>再生リスト</h2><span id="summary" class="small muted">0本</span></div><div class="row"><button id="backup" class="ghost small">バックアップ</button><label class="filebtn ghost small">復元<input id="restore" type="file" accept="application/json,.json"></label></div></div><ol id="queue" class="queue"></ol><div id="empty" class="empty">上の欄にYouTube URLを貼り付けてください。</div></section>
</main>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
(()=>{'use strict';
const K='ytq_state_v3',SK='ytq_settings_v3',SAVE=2500,$=id=>document.getElementById(id),E={form:$('form'),url:$('url'),msg:$('msg'),now:$('now'),time:$('time'),status:$('status'),queue:$('queue'),empty:$('empty'),summary:$('summary'),prev:$('prev'),next:$('next'),restart:$('restart'),rate:$('rate'),auto:$('auto'),backup:$('backup'),restore:$('restore'),install:$('install')};let S=read(K,{items:[],i:-1}),Q=read(SK,{rate:1,auto:true}),P=null,ready=false,ending=false,prompt=null;S.items=(Array.isArray(S.items)?S.items:[]).map(clean).filter(Boolean);S.i=S.items.length?Math.min(Math.max(Number.isInteger(S.i)?S.i:0,0),S.items.length-1):-1;Q.rate=+Q.rate||1;Q.auto=Q.auto!==false;E.rate.value=String(Q.rate);E.auto.checked=Q.auto;render();media();
function read(k,d){try{return{...d,...JSON.parse(localStorage.getItem(k)||'{}')}}catch{return d}}function write(){localStorage.setItem(K,JSON.stringify(S));localStorage.setItem(SK,JSON.stringify(Q))}function clean(x){const id=vid(x?.id||x?.url);if(!id)return null;return{id,url:'https://www.youtube.com/watch?v='+id,title:String(x.title||id).slice(0,300),pos:Math.max(0,+x.pos||+x.position||0),dur:Math.max(0,+x.dur||+x.duration||0),done:!!(x.done||x.completed)}}function vid(v){v=String(v||'').trim();if(/^[\w-]{11}$/.test(v))return v;try{const u=new URL(v.startsWith('http')?v:'https://'+v),h=u.hostname.replace(/^www\.|^m\./,'');if(h==='youtu.be')return ok(u.pathname.split('/').filter(Boolean)[0]);if(h==='youtube.com'||h.endsWith('.youtube.com')){const q=u.searchParams.get('v');if(q)return ok(q);const p=u.pathname.split('/').filter(Boolean);if(['shorts','embed','live'].includes(p[0]))return ok(p[1])}}catch{}return null}function ok(v){v=String(v||'').split(/[?&#]/)[0];return /^[\w-]{11}$/.test(v)?v:null}
window.onYouTubeIframeAPIReady=()=>{P=new YT.Player('player',{playerVars:{autoplay:0,controls:1,playsinline:1,rel:0,enablejsapi:1,origin:location.origin},events:{onReady(){ready=true;if(S.i>=0)load(S.i,false,false);setInterval(tick,SAVE);stat('連続再生：待機中')},onStateChange:state,onError:e=>msg('YouTube再生エラー '+e.data,'err')}})};
function cur(){return S.items[S.i]||null}function state(e){if(!cur())return;if([YT.PlayerState.PLAYING,YT.PlayerState.PAUSED,YT.PlayerState.CUED].includes(e.data)){const d=P.getVideoData?.();if(d?.video_id===cur().id&&d.title)cur().title=d.title;save();rate();render();stat(e.data===YT.PlayerState.PLAYING?'再生中：位置を自動保存':e.data===YT.PlayerState.PAUSED?'一時停止：位置を保存済み':'連続再生：再生待ち')}if(e.data===YT.PlayerState.ENDED)ended()}function load(i,play=true,saveOld=true){if(!ready||!S.items[i])return;if(saveOld)save();S.i=i;const x=cur();if(x.done)x.pos=0;x.done=false;ending=false;write();render();const o={videoId:x.id,startSeconds:Math.max(0,+x.pos||0)};play?P.loadVideoById(o):P.cueVideoById(o);rate();mediaMeta()}function save(){if(!ready||!cur()||ending)return;try{const d=P.getVideoData?.();if(d?.video_id&&d.video_id!==cur().id)return;cur().pos=+P.getCurrentTime()||0;cur().dur=+P.getDuration()||cur().dur||0;write()}catch{}}function tick(){if(!ready)return;save();progress();try{const d=+P.getDuration()||0,p=+P.getCurrentTime()||0;if(d>0&&d-p<.35&&P.getPlayerState()!==YT.PlayerState.PLAYING&&!cur().done)ended()}catch{}}function ended(){if(ending||!cur())return;ending=true;cur().pos=0;cur().done=true;write();render();if(Q.auto&&S.i<S.items.length-1)setTimeout(()=>load(S.i+1,true,false),150);else ending=false}function rate(){try{P.setPlaybackRate(Q.rate)}catch{}}function progress(){const x=cur();if(!x)return E.time.textContent='0:00 / 0:00';try{x.pos=+P.getCurrentTime()||x.pos;x.dur=+P.getDuration()||x.dur}catch{}E.time.textContent=fmt(x.pos)+' / '+fmt(x.dur)}
function render(){E.summary.textContent=S.items.length+'本';E.empty.classList.toggle('hidden',S.items.length>0);E.now.textContent=cur()?cur().title:'まだ選択されていません';E.queue.innerHTML='';S.items.forEach((x,i)=>{const li=document.createElement('li');li.className='item'+(i===S.i?' current':'');li.innerHTML='<span class="num"></span><div class="main"><span class="title"></span><span class="meta"></span></div><div class="ord"><button data-a="up">↑</button><button data-a="down">↓</button></div><div class="actions"><button data-a="del">×</button></div>';li.querySelector('.num').textContent=String(i+1).padStart(2,'0');li.querySelector('.title').textContent=x.title;li.querySelector('.meta').textContent=x.done?'済':x.dur?fmt(x.pos)+'/'+fmt(x.dur):x.pos?fmt(x.pos):'未';li.querySelector('.main').onclick=()=>load(i,true);li.querySelectorAll('button').forEach(b=>b.onclick=()=>act(b.dataset.a,i));E.queue.appendChild(li)});progress()}function act(a,i){if(a==='del'){save();S.items.splice(i,1);if(!S.items.length)S.i=-1;else if(i<S.i)S.i--;else if(i===S.i)S.i=Math.min(S.i,S.items.length-1);write();render();if(S.i>=0)load(S.i,false,false);return}if(a==='up'&&i>0)move(i,i-1);if(a==='down'&&i<S.items.length-1)move(i,i+1)}function move(a,b){save();[S.items[a],S.items[b]]=[S.items[b],S.items[a]];if(S.i===a)S.i=b;else if(S.i===b)S.i=a;write();render()}function add(raw){const id=vid(raw);if(!id)return msg('YouTubeのURLとして認識できませんでした。','err');const n=S.items.findIndex(x=>x.id===id);if(n>=0){load(n,true);return msg('すでにある動画へ移動しました。','ok')}S.items.push(clean({id,title:'動画 '+(S.items.length+1)}));if(S.i<0)S.i=0;write();render();if(ready&&S.items.length===1)load(0,false,false);msg('追加しました。','ok')}function fmt(n){n=Math.max(0,Math.floor(+n||0));const h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=n%60;return h?h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'):m+':'+String(s).padStart(2,'0')}function msg(t,c=''){E.msg.textContent=t;E.msg.className='msg '+c}function stat(t){E.status.textContent=t}
function backup(){save();const b=new Blob([JSON.stringify({app:'YT Queue',version:3,state:S,settings:Q},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='yt-queue-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function restore(f){try{const j=JSON.parse(await f.text()),s=j.state||j;S={items:(s.items||[]).map(clean).filter(Boolean),i:Number.isInteger(s.i)?s.i:0};S.i=S.items.length?Math.min(Math.max(S.i,0),S.items.length-1):-1;if(j.settings)Q={rate:+j.settings.rate||1,auto:j.settings.auto!==false};E.rate.value=String(Q.rate);E.auto.checked=Q.auto;write();render();if(ready&&S.i>=0)load(S.i,false,false);msg('バックアップを復元しました。','ok')}catch{msg('バックアップを読み込めませんでした。','err')}E.restore.value=''}
function media(){if(!('mediaSession'in navigator))return;const set=(a,f)=>{try{navigator.mediaSession.setActionHandler(a,f)}catch{}};set('play',()=>P?.playVideo());set('pause',()=>P?.pauseVideo());set('nexttrack',()=>S.i<S.items.length-1&&load(S.i+1,true));set('previoustrack',()=>S.i>0&&load(S.i-1,true));set('seekbackward',()=>seek(-10));set('seekforward',()=>seek(10))}function seek(d){try{P.seekTo(Math.max(0,(+P.getCurrentTime()||0)+d),true)}catch{}}function mediaMeta(){if(!('mediaSession'in navigator)||!cur())return;try{navigator.mediaSession.metadata=new MediaMetadata({title:cur().title,artist:'YT Queue',album:(S.i+1)+' / '+S.items.length})}catch{}}
E.form.onsubmit=e=>{e.preventDefault();add(E.url.value);E.url.value=''};E.prev.onclick=()=>S.i>0&&load(S.i-1,true);E.next.onclick=()=>S.i<S.items.length-1&&load(S.i+1,true);E.restart.onclick=()=>{if(!cur())return;cur().pos=0;cur().done=false;write();P.seekTo(0,true);P.playVideo()};E.rate.onchange=()=>{Q.rate=+E.rate.value||1;write();rate()};E.auto.onchange=()=>{Q.auto=E.auto.checked;write()};E.backup.onclick=backup;E.restore.onchange=()=>E.restore.files?.[0]&&restore(E.restore.files[0]);['pagehide','beforeunload'].forEach(n=>addEventListener(n,save));document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});addEventListener('beforeinstallprompt',e=>{e.preventDefault();prompt=e;E.install.classList.remove('hidden')});E.install.onclick=async()=>{if(!prompt)return;prompt.prompt();await prompt.userChoice;prompt=null;E.install.classList.add('hidden')};if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>
</body></html>
